# Cloudflare Worker config. See README "Deploying" for setup steps.
# `name` must match the Worker's name in the Cloudflare dashboard, or
# Workers Builds refuses to deploy.
name = "partner-gym-trainer"
main = "worker/index.ts"
compatibility_date = "2026-08-15"

# The Astro build (npm run build) is served as static assets. Only /api/*
# invokes the Worker script; every other request is served straight from
# dist/ (static asset requests are free and don't count against Worker
# request limits). public/_headers is applied to asset responses.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Environment variables are deliberately NOT declared here: [vars] in this
# file would overwrite dashboard values on every deploy. Set them as secrets:
#
#   npx wrangler secret put SUPER_USER_EMAILS
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#
#   SUPER_USER_EMAILS     Comma-separated emails that may sign up without an
#                         invite and manage invites, accounts and storage.
#   GOOGLE_CLIENT_ID      OAuth client ID from Google Cloud Console.
#   GOOGLE_CLIENT_SECRET  OAuth client secret from Google Cloud Console.
#
# Local development reads the same names (plus the dev-only DEV_LOGIN and
# ALLOWED_ORIGINS) from .dev.vars; see .dev.vars.example.

[[d1_databases]]
binding = "DB"
database_name = "spotter"
database_id = "2abff030-c047-4098-a8ac-86114e8e45a5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "spotter-photos"
