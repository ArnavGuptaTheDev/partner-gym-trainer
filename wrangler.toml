# Cloudflare Pages project config. See README "Deploying" for setup steps.
name = "spotter"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-15"

# Environment variables are deliberately NOT declared here: [vars] in this
# file would override dashboard values. Set them per project instead:
#
#   npx wrangler pages secret put SUPER_USER_EMAILS    --project-name spotter
#   npx wrangler pages secret put GOOGLE_CLIENT_ID     --project-name spotter
#   npx wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name spotter
#
#   SUPER_USER_EMAILS     Comma-separated emails that may sign up without an
#                         invite and manage invites, accounts and storage.
#   GOOGLE_CLIENT_ID      OAuth client ID from Google Cloud Console.
#   GOOGLE_CLIENT_SECRET  OAuth client secret from Google Cloud Console.
#
# Local development reads the same names (plus the dev-only DEV_LOGIN and
# ALLOWED_ORIGINS) from .dev.vars; see .dev.vars.example.

[[d1_databases]]
binding = "DB"
database_name = "spotter"
# Replace with the id printed by `wrangler d1 create spotter`.
database_id = "2abff030-c047-4098-a8ac-86114e8e45a5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "spotter-photos"
