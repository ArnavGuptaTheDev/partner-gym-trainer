# Cloudflare Pages project config. See README "Deploying" for setup steps.
name = "spotter"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-15"

# Non-secret defaults. Override per environment in the Pages dashboard
# (Settings -> Variables) or locally in .dev.vars.
#
#   SUPER_USER_EMAILS  Comma-separated emails allowed to register without an
#                      invite and manage invites/users. Required.
#   ALLOWED_ORIGINS    Extra origins accepted on mutating requests, comma-
#                      separated. Only needed for local dev where the Astro dev
#                      server (http://localhost:4321) proxies to wrangler.
[vars]
SUPER_USER_EMAILS = ""
ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "spotter"
# Replace with the id printed by `wrangler d1 create spotter`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "spotter-photos"
